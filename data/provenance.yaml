checked:
  note: scripts/02_verify.py, with Python's csv module and DuckDB, before upload
  items:
    - every raw file against MANIFEST.json (size and sha256); structure files well-formed XML
    - every SDMX-CSV answer read with the csv module, header as the DSD gives, DATAFLOW and REF_AREA on every row, row counts as in the manifest
    - every planned area has its file; no failed slice
    - rows per flow equal the observation count the API states (sdmx_metrics), all five
    - every cell of each dataflow Parquet equals the CSV's, in file and row order
    - every dimension code is in its codelist
    - a DuckDB without extension autoloading opens every file
    - no bloom filters

modifications:
  raw: none. The API's answers, byte for byte.
  parquet:
    - one Parquet per dataflow, its area files concatenated in REF_AREA code order, rows in the order sent
    - OBS_VALUE, CONVERSION_FACTOR, PRE_BREAK_VALUE as DOUBLE; UNIT_MULT, DECIMALS as INTEGER; all else text
    - a value that does not fit its type stops the build; empty cells NULL; "NA" (111,167 rows) and ":" (613 rows) in OBS_VALUE NULL
    - codelists and components read from the structure messages of the same run
    - written with zstd, without bloom filters
